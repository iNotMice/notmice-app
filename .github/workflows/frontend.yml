name: frontend

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run lint
      - name: Copy gate (banned claims, home-page terms, locales)
        run: npm run check:copy
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
