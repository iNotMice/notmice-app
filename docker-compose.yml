# Module 1: api / postgres / proxy
# Start: docker compose up --build
# Health: http://localhost:8080/healthz

name: notmice

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-notmice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notmice}
      POSTGRES_DB: ${POSTGRES_DB:-notmice}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One API container. Rate limits and extract sessions live in this process; do not scale `api`.
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-notmice}:${POSTGRES_PASSWORD:-notmice}@postgres:5432/${POSTGRES_DB:-notmice}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8080}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SEED_HASH_SECRET: ${SEED_HASH_SECRET:-dev-insecure-seed-hash-change-me-not-for-prod}
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-jwt-signing-change-me-not-for-prod}
      AUTH_SEED_ENABLED: ${AUTH_SEED_ENABLED:-true}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:8080}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      ACCOUNT_RATE_LIMIT: ${ACCOUNT_RATE_LIMIT:-20}
      ACCOUNT_RATE_LIMIT_WINDOW_SECONDS: ${ACCOUNT_RATE_LIMIT_WINDOW_SECONDS:-900}
      ACCOUNT_IDENTITY_RATE_LIMIT: ${ACCOUNT_IDENTITY_RATE_LIMIT:-5}
      ACCOUNT_IDENTITY_RATE_LIMIT_WINDOW_SECONDS: ${ACCOUNT_IDENTITY_RATE_LIMIT_WINDOW_SECONDS:-900}
      VISION_PROVIDER: ${VISION_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_DAILY_TOKEN_BUDGET: ${GEMINI_DAILY_TOKEN_BUDGET:-2000000}
      GEMINI_USER_DAILY_TOKEN_BUDGET: ${GEMINI_USER_DAILY_TOKEN_BUDGET:-100000}
      GEMINI_IP_DAILY_TOKEN_BUDGET: ${GEMINI_IP_DAILY_TOKEN_BUDGET:-150000}
      GEMINI_CALL_TOKEN_RESERVE: ${GEMINI_CALL_TOKEN_RESERVE:-16000}
      GEMINI_USER_DAILY_CALLS: ${GEMINI_USER_DAILY_CALLS:-8}
      GEMINI_IP_DAILY_CALLS: ${GEMINI_IP_DAILY_CALLS:-12}
      GEMINI_BUDGET_WARN_RATIO: ${GEMINI_BUDGET_WARN_RATIO:-0.8}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-5}
      DATASET_RATE_LIMIT: ${DATASET_RATE_LIMIT:-60}
      DATASET_RATE_LIMIT_WINDOW_SECONDS: ${DATASET_RATE_LIMIT_WINDOW_SECONDS:-60}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s
    restart: unless-stopped

  proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    environment:
      DOCS_BASIC_AUTH_USER: ${DOCS_BASIC_AUTH_USER:-docs}
      DOCS_BASIC_AUTH_PASSWORD: ${DOCS_BASIC_AUTH_PASSWORD:-dev-docs-change-me}
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
