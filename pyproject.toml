[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "notmice-api"
version = "0.1.0"
description = "NotMice Phase 2 API: FastAPI backend for the biomarker dataset pipeline."
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "httpx>=0.27",
    "google-genai>=1.0",
    "mnemonic>=0.21",
    "pdfplumber>=0.11",
    "pypdfium2>=4.30",
    "pillow>=11",
    "pytesseract>=0.3",
    "pyarrow>=17",
    "pydantic-settings>=2.6",
    "pydantic>=2.10",
    "pycountry>=24.6",
    "PyJWT>=2.9",
    "python-multipart>=0.0.12",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=24.4",
    "tenacity>=9.0",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "mypy>=1.13",
    "pytest-asyncio>=0.24",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["app.tests*"]

[tool.setuptools.package-data]
"app.data" = ["loinc/*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
exclude = "^app/migrations/"

[[tool.mypy.overrides]]
module = [
    "mnemonic",
    "pycountry",
    "pdfplumber",
    "pypdfium2",
    "pytesseract",
    "google",
    "google.*",
    "pyarrow",
    "pyarrow.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["app/tests"]
pythonpath = ["."]
